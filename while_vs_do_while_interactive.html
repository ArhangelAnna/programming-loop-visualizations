<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>while и do while — интерактивное сравнение</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1a2640;background:#f6f8fc}*{box-sizing:border-box}body{margin:0;padding:18px}.app{max-width:1050px;margin:auto}h1{font-size:clamp(21px,3.5vw,30px);margin:0 0 7px}p{line-height:1.55}.lead{color:#53637c;margin:0 0 18px}.toolbar,.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:13px 0}.label{font-size:14px;font-weight:650}.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#e8edf7}.seg button{border:0;background:transparent;color:#425370;padding:9px 15px;border-radius:9px;font-weight:700;cursor:pointer}.seg button.active{background:#fff;color:#2459bd;box-shadow:0 1px 5px #aab8d966}select{padding:9px 11px;border:1px solid #cbd5e6;border-radius:9px;background:white;font-size:15px;color:#1c2c48}.panel{background:white;border:1px solid #dce4f1;border-radius:15px;padding:16px;box-shadow:0 3px 14px #1b355b0a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font-size:20px;margin:0 0 10px}.badge{font-size:12px;padding:4px 8px;border-radius:99px;background:#eaf0ff;color:#2e5bb0}.code{font:15px/1.9 ui-monospace,SFMono-Regular,Consolas,monospace;background:#17243a;color:#e3ecff;border-radius:11px;padding:12px 10px;overflow:auto;white-space:pre}.line{display:block;padding:0 8px;border-left:3px solid transparent;border-radius:4px;transition:background .12s}.line.on{background:#355c9a88;border-color:#75b8ff}.kw{color:#86b7ff}.num{color:#ffce8c}.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.metric{background:#f3f6fc;border-radius:10px;padding:10px}.metric small{display:block;color:#62738e;margin-bottom:5px}.metric strong{font:600 21px ui-monospace,Consolas,monospace}.message{background:#f1f5ff;border-radius:10px;padding:10px 12px;min-height:86px;font-size:14px;line-height:1.45}.message.done{background:#eaf7ef}.message.warn{background:#fff3e6}.controls button{border:1px solid #c7d4e8;border-radius:10px;background:white;color:#223955;padding:10px 14px;cursor:pointer;font-weight:650;font-size:14px}.controls button.primary{background:#315fc6;color:#fff;border-color:#315fc6}.controls button:disabled{opacity:.4;cursor:not-allowed}.note{background:#edf5ff;border-left:4px solid #538ad6;border-radius:8px;padding:11px 14px;margin-top:12px;line-height:1.5}.counter{margin-left:auto;color:#65758e;font-size:13px}.foot{font-size:13px;color:#586b83;margin-top:13px}.status{font-size:12px;color:#63748a}button:focus-visible,select:focus-visible{outline:3px solid #92baff;outline-offset:2px}@media(max-width:720px){body{padding:10px}.grid{grid-template-columns:1fr}.panel{padding:12px}.code{font-size:13px}.toolbar{align-items:flex-start}.counter{margin-left:0}}
</style>
</head>
<body><main class="app">
<div class="panel">
<div class="toolbar"><span class="label">Начальное значение:</span><select id="start"><option value="10">x = 10 — условие сразу ложно</option><option value="2">x = 2 — условие сначала истинно</option><option value="4">x = 4 — одна итерация в обоих</option></select><span class="label" style="margin-left:auto">Язык:</span><div class="seg" id="langs"><button class="active" data-lang="cs" type="button">C#</button><button data-lang="cpp" type="button">C++</button></div></div>
<div class="grid">
<section class="card" aria-label="Цикл while"><h2>while <span class="badge">проверка ДО тела</span></h2><div class="code" id="code-while"></div><div class="stat"><div class="metric"><small>Переменная x</small><strong id="x-while">—</strong></div><div class="metric"><small>Условие x &lt; 5</small><strong id="cond-while">—</strong></div><div class="metric"><small>Консоль</small><strong id="out-while">пусто</strong></div><div class="metric"><small>Выполнено тел</small><strong id="count-while">0</strong></div></div><div class="message" id="msg-while" aria-live="polite"></div></section>
<section class="card" aria-label="Цикл do while"><h2>do while <span class="badge">проверка ПОСЛЕ тела</span></h2><div class="code" id="code-do"></div><div class="stat"><div class="metric"><small>Переменная x</small><strong id="x-do">—</strong></div><div class="metric"><small>Условие x &lt; 5</small><strong id="cond-do">—</strong></div><div class="metric"><small>Консоль</small><strong id="out-do">пусто</strong></div><div class="metric"><small>Выполнено тел</small><strong id="count-do">0</strong></div></div><div class="message" id="msg-do" aria-live="polite"></div></section>
</div>
<div class="controls"><button id="prev" type="button">← Назад</button><button class="primary" id="next" type="button">Следующий шаг →</button><button id="auto" type="button">▶ Авто</button><button id="reset" type="button">↺ Сначала</button><span class="counter" id="progress"></span></div>
<div class="note" id="conclusion">Нажми «Следующий шаг». Обрати внимание: когда <code>x = 10</code>, проверка <code>10 &lt; 5</code> ложна сразу.</div>
</div></main>
<script>
'use strict';
const els={start:document.getElementById('start'),next:document.getElementById('next'),prev:document.getElementById('prev'),auto:document.getElementById('auto'),reset:document.getElementById('reset')};
let lang='cs', step=0, timer=null, sequences={};
function build(kind,start){let x=start,out=[],runs=0,frames=[{x,cond:null,out:[],runs,active:'init',msg:'Начало: переменная x получает значение '+x+'.'}];const add=(active,cond,msg)=>frames.push({x,cond,out:[...out],runs,active,msg});if(kind==='while'){
for(let k=0;k<12;k++){let ok=x<5;add('cond',ok,`Проверка до тела: ${x} < 5 — ${ok?'истина':'ложь'}. ${ok?'Выполняем тело.':'Цикл завершён, тело не выполняется.'}`);if(!ok)break;out.push(x);runs++;add('write',true,'Выводим '+x+' в консоль.');x++;add('inc',true,'Увеличиваем x на 1: теперь x = '+x+'.');}
}else{for(let k=0;k<12;k++){out.push(x);runs++;add('write',null,'Сначала выполняем тело: выводим '+x+' без предварительной проверки.');x++;add('inc',null,'Увеличиваем x на 1: теперь x = '+x+'.');let ok=x<5;add('cond',ok,`Теперь проверяем: ${x} < 5 — ${ok?'истина, повторяем тело.':'ложь, цикл завершён.'}`);if(!ok)break;}}
return frames;}
function code(kind){const output=lang==='cs'?'Console.Write(x + " ");':'cout << x << " ";';const w=kind==='while';return `<span class="line" data-part="init">int x = <span class="num">${els.start.value}</span>;</span><span class="line" data-part="cond">${w?'<span class="kw">while</span> (x &lt; 5) {':'<span class="kw">do</span> {'}</span><span class="line" data-part="write">    ${output.replaceAll('<','&lt;').replaceAll('>','&gt;')}</span><span class="line" data-part="inc">    x++;</span><span class="line" data-part="end">${w?'}':'} <span class="kw">while</span> (x &lt; 5);'}</span>`;}
function rebuild(){stop();const start=Number(els.start.value);sequences={while:build('while',start),do:build('do',start)};step=0;document.getElementById('code-while').innerHTML=code('while');document.getElementById('code-do').innerHTML=code('do');render();}
function renderCard(kind){const seq=sequences[kind],f=seq[Math.min(step,seq.length-1)],suffix=kind;document.getElementById('x-'+suffix).textContent=f.x;document.getElementById('cond-'+suffix).textContent=f.cond===null?'ещё нет':(f.cond?'true':'false');document.getElementById('out-'+suffix).textContent=f.out.length?f.out.join(' '):'пусто';document.getElementById('count-'+suffix).textContent=f.runs;const msg=document.getElementById('msg-'+suffix);msg.textContent=f.msg;msg.className='message'+(f.cond===false?' done':'');document.querySelectorAll('#code-'+suffix+' .line').forEach(el=>el.classList.toggle('on',el.dataset.part===f.active));}
function render(){renderCard('while');renderCard('do');const max=Math.max(sequences.while.length,sequences.do.length)-1;document.getElementById('progress').textContent=`Шаг ${step} из ${max}`;els.prev.disabled=step===0;els.next.disabled=step===max;const start=Number(els.start.value),w=sequences.while.at(-1),d=sequences.do.at(-1);const note=document.getElementById('conclusion');note.textContent=step<max?'Следи за подсвеченной строкой в каждом цикле. Если один цикл уже завершился, второй может продолжать выполнение.':`Готово! При x = ${start} тело while выполнилось ${w.runs} раз(а), а тело do while — ${d.runs} раз(а). У while условие проверяется до первого выполнения тела; у do while — после него.`;}
function stop(){if(timer!==null){clearInterval(timer);timer=null;}els.auto.textContent='▶ Авто';}
els.next.onclick=()=>{stop();const max=Math.max(sequences.while.length,sequences.do.length)-1;if(step<max){step++;render();}};
els.prev.onclick=()=>{stop();if(step>0){step--;render();}};
els.reset.onclick=()=>rebuild();
els.auto.onclick=()=>{if(timer!==null){stop();return;}const max=Math.max(sequences.while.length,sequences.do.length)-1;if(step>=max)step=0;render();els.auto.textContent='Ⅱ Пауза';timer=setInterval(()=>{if(step<max){step++;render();}if(step>=max)stop();},1400);};
els.start.onchange=rebuild;
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(c=>c.classList.toggle('active',c===b));rebuild();});
window.addEventListener('pagehide',stop);rebuild();
</script>
</body></html>
